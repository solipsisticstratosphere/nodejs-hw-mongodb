tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with the provided payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Jane Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+123456789'
          email:
            description: "Contact's email address"
            type: string
            format: email
            example: 'jane.doe@example.com'
          isFavourite:
            description: 'Indicates if the contact is marked as favourite'
            type: boolean
            example: true
          contactType:
            description: 'Type of contact (work, home, or personal)'
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
