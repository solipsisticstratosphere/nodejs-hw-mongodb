tags:
  - Contacts
summary: Update contact details by ID
operationId: patchContactById
description: >
  Partially update the contact details for the given contact ID. If the provided ID
  does not exist, a 404 error will be returned.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    description: Unique identifier of the contact to update
    example: 65e4decdd286b30065d54af9
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: Contact's name
            type: string
            example: 'Jane Doe'
          phoneNumber:
            description: Contact's phone number
            type: string
            example: '+123456789'
          email:
            description: Contact's email address
            type: string
            format: email
            example: 'jane.doe@example.com'
          isFavourite:
            description: Indicates if the contact is marked as favourite
            type: boolean
            example: true
          contactType:
            description: Type of contact (work, home, or personal)
            type: string
            enum: ['work', 'home', 'personal']
            example: 'work'
          photo:
            description: Updated photo of the contact
            type: string
            format: binary
responses:
  '200':
    description: Successfully updated the contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    description: The contact ID does not exist.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - error
          properties:
            status:
              type: integer
              example: 404
            error:
              type: string
              example: Contact with the provided ID was not found.
  '401':
    $ref: '../../../components/responses/401.yaml'
